name: Deploy site

# docs/ is committed as the build artifact, same as the ML-Notes repo: the
# author runs the local build (parse.py + build.py under _app/) and commits
# docs/index.html directly. CI just packages docs/ and deploys it.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the committed site
        run: |
          test -f docs/index.html || { echo "::error::docs/index.html missing"; exit 1; }
          test -f docs/.nojekyll || { echo "::error::docs/.nojekyll missing — Jekyll would mangle the build"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
